name: Test

on:
  push:
    branches: [main]
  pull_request:
  # A version given by hand tests that release as a workflow pinning it
  # installs it, rather than whatever is latest.
  workflow_dispatch:
    inputs:
      version:
        description: The nova-nix release to test, for example 0.8.0.0, or latest.
        type: string
        default: latest
  # canary.yml calls this weekly.
  workflow_call:

permissions:
  contents: read

jobs:
  # The version input is free text, and the action splices it into its
  # download URL, where a slash or a dot-dot would point it at another
  # repository's release.  So it is checked once, before anything installs it.
  version:
    name: Version under test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        shell: bash
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          set -euo pipefail
          release='^v?[0-9]+(\.[0-9]+)*$'
          # Not echoed: a line of unchecked text can read as a workflow command.
          if [ "${VERSION}" != latest ] && [[ ! "${VERSION}" =~ ${release} ]]; then
            echo "::error::version must name a release, such as 0.8.0.0, or be latest"
            exit 1
          fi
          echo "version=${VERSION#v}" >> "${GITHUB_OUTPUT}"

  install:
    name: Install ${{ needs.version.outputs.version }} (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        id: nova
        with:
          version: ${{ needs.version.outputs.version }}

      # Separate steps on purpose: a PATH entry written to GITHUB_PATH takes
      # effect only in the steps after the one that wrote it, so running the
      # executable inside the action would prove nothing about the export.
      - name: nova-nix is on PATH and evaluates
        shell: bash
        run: |
          set -euo pipefail
          got=$(nova-nix eval --expr '1 + 2')
          [ "$got" = 3 ] || { echo "expected 3, got $got" >&2; exit 1; }

      # The archive ships its own share/, and resolving through it is what
      # separates a binary that can build from one that can only evaluate.
      - name: The bundled search path resolves
        shell: bash
        run: |
          set -euo pipefail
          got=$(nova-nix eval --expr 'builtins.typeOf (import <nix/fetchurl.nix>)')
          [ "$got" = '"lambda"' ] || { echo "expected a lambda, got $got" >&2; exit 1; }

      - name: The bundled recipes came with it
        shell: bash
        env:
          BIN_DIR: ${{ steps.nova.outputs.bin-dir }}
        run: |
          set -euo pipefail
          [ -f "${BIN_DIR}/../pkgs/windows/hello.nix" ] \
            || { echo "no pkgs/ beside ${BIN_DIR}" >&2; exit 1; }

      # GITHUB_PATH is written from bash, where RUNNER_TEMP is a Windows path
      # and the entry ends up mixed-separator.  Windows accepts that and MSYS
      # bash would accept anything, so a shell that is neither is the one that
      # can tell.
      - name: nova-nix is on PATH outside bash (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $got = nova-nix eval --expr '1 + 2'
          if ($got -ne '3') { Write-Error "expected 3, got $got"; exit 1 }

  # Installing and evaluating is not the same as building, and building is
  # most of what someone installs this to do.  The archive carries share/ so
  # <nix/*> resolves and pkgs/ so there is something to build; nothing proved
  # the two work together from a downloaded release until here.  The toolchain
  # substitutes from the public cache: nova-nix publishes its Windows closure
  # from every push to main, and fails that run if a fresh store would build
  # any of it.  Not asserted here: nova-nix builds whatever the cache lacks,
  # so a gap costs this job minutes, and nova-nix's CI is where it turns red.
  build:
    name: Build a package with it
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        id: nova
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Build hello from the bundled recipes
        shell: bash
        env:
          BIN: ${{ steps.nova.outputs.bin-dir }}
        run: |
          set -euo pipefail
          out=$(nova-nix build "$BIN/../pkgs/windows/hello.nix" \
            --substituter https://cache.novavero.ai \
            --trusted-key cache.novavero.ai-1:9gQ7tLWMM+2tdC9H5sKMJltDIPfD7X2GWlZe8Aa8hHQ= \
            | tail -n1)
          echo "built: $out"
          [ -n "$out" ] || { echo "no store path on stdout" >&2; exit 1; }
          echo "out=$out" >> "$GITHUB_ENV"

      - name: The built program runs
        shell: pwsh
        env:
          LC_ALL: C
        run: |
          # New releases build GNU Hello through stdenv; 0.7.0.0 shipped a
          # small demo installed at the output root. Check each layout's
          # exact output while latest still transitions between the two.
          $hello = Join-Path $env:out "bin/hello.exe"
          $expected = "Hello, world!"
          if (-not (Test-Path -PathType Leaf $hello)) {
            $hello = Join-Path $env:out "hello.exe"
            $expected = "Hello from the first native Windows Nix build."
          }
          if (-not (Test-Path -PathType Leaf $hello)) {
            Write-Error "no bin/hello.exe or hello.exe in $env:out"; exit 1
          }
          $got = (& $hello) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Error "hello failed with exit code $LASTEXITCODE"; exit 1 }
          Write-Host "output: $got"
          if ($got -cne $expected) {
            Write-Error "expected '$expected', got '$got'"; exit 1
          }

  pinned:
    name: Install a pinned version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The pinned path builds a different URL from the latest path, so it is
      # not covered by the matrix above.
      - uses: ./
        with:
          version: 0.7.0.0

      - name: The pinned version evaluates
        shell: bash
        run: |
          set -euo pipefail
          got=$(nova-nix eval --expr '1 + 2')
          [ "$got" = 3 ] || { echo "expected 3, got $got" >&2; exit 1; }
